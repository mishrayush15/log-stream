name: CI — build, lint, test, publish images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Build frontend
        run: npm run build

  server:
    name: Server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Build server
        run: npm run build --prefix server

  publish_images:
    name: Build & publish Docker images (GHCR)
    runs-on: ubuntu-latest
    needs: [frontend, server]
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/logstream-frontend:${{ github.sha }} -f Dockerfile .
          docker push ghcr.io/${{ github.repository_owner }}/logstream-frontend:${{ github.sha }}
      - name: Build and push server image
        if: exists('server/Dockerfile') || always()
        run: |
          if [ -f server/Dockerfile ]; then \
            docker build -t ghcr.io/${{ github.repository_owner }}/logstream-server:${{ github.sha }} -f server/Dockerfile server && \
            docker push ghcr.io/${{ github.repository_owner }}/logstream-server:${{ github.sha }}; \
          else echo 'server/Dockerfile not found, skipping'; fi
      - name: Build and push log-generator image
        if: exists('log-generator/Dockerfile') || always()
        run: |
          if [ -f log-generator/Dockerfile ]; then \
            docker build -t ghcr.io/${{ github.repository_owner }}/logstream-generator:${{ github.sha }} -f log-generator/Dockerfile log-generator && \
            docker push ghcr.io/${{ github.repository_owner }}/logstream-generator:${{ github.sha }}; \
          else echo 'log-generator/Dockerfile not found, skipping'; fi
